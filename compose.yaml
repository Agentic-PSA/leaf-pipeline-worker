services:
  leaf-pipeline:
    build: .
    env_file: .env
    restart: "no"
    # Override CMD in docker compose run:
    #   docker compose run leaf-pipeline --job-id <UUID>
    #   docker compose run leaf-pipeline --from 100000 --to 105000 --workers 10

  leaf-pipeline-api:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"